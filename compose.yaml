services:
  repopilot:
    image: ${REPOPILOT_IMAGE:-repopilot:local}
    build: .
    ports:
      - "${REPOPILOT_BIND_ADDRESS:-127.0.0.1}:${REPOPILOT_PORT:-8000}:8000"
    environment:
      REPOPILOT_PROVIDER: ${REPOPILOT_PROVIDER:-deterministic}
      REPOPILOT_DATABASE_URL: sqlite+aiosqlite:////app/data/repopilot.db
      REPOPILOT_WORKSPACE_ROOT: /workspace
      REPOPILOT_REPOSITORY_ROOT: /repositories
      REPOPILOT_ALLOWED_REPOSITORY_ROOTS: /workspace,/imports
      REPOPILOT_LLM_BASE_URL: ${REPOPILOT_LLM_BASE_URL:-}
      REPOPILOT_LLM_API_KEY: ${REPOPILOT_LLM_API_KEY:-}
      REPOPILOT_LLM_MODEL: ${REPOPILOT_LLM_MODEL:-}
      REPOPILOT_LLM_CONNECT_TIMEOUT_SECONDS: ${REPOPILOT_LLM_CONNECT_TIMEOUT_SECONDS:-10}
      REPOPILOT_LLM_READ_TIMEOUT_SECONDS: ${REPOPILOT_LLM_READ_TIMEOUT_SECONDS:-120}
      REPOPILOT_LLM_WRITE_TIMEOUT_SECONDS: ${REPOPILOT_LLM_WRITE_TIMEOUT_SECONDS:-30}
      REPOPILOT_LLM_POOL_TIMEOUT_SECONDS: ${REPOPILOT_LLM_POOL_TIMEOUT_SECONDS:-10}
      REPOPILOT_LLM_STREAMING_ENABLED: ${REPOPILOT_LLM_STREAMING_ENABLED:-true}
      REPOPILOT_LLM_STREAM_INCLUDE_USAGE: ${REPOPILOT_LLM_STREAM_INCLUDE_USAGE:-true}
      REPOPILOT_LLM_STREAM_PROGRESS_INTERVAL_SECONDS: ${REPOPILOT_LLM_STREAM_PROGRESS_INTERVAL_SECONDS:-5}
      REPOPILOT_LLM_MAX_ATTEMPTS: ${REPOPILOT_LLM_MAX_ATTEMPTS:-3}
      REPOPILOT_DAILY_TASK_LIMIT: ${REPOPILOT_DAILY_TASK_LIMIT:-0}
      REPOPILOT_DAILY_QUOTA_TIMEZONE: ${REPOPILOT_DAILY_QUOTA_TIMEZONE:-UTC}
      REPOPILOT_API_TOKEN: ${REPOPILOT_API_TOKEN:-}
      REPOPILOT_ADMIN_API_TOKEN: ${REPOPILOT_ADMIN_API_TOKEN:-}
      REPOPILOT_PUBLIC_DEMO_MODE: ${REPOPILOT_PUBLIC_DEMO_MODE:-false}
      REPOPILOT_MAX_STEPS: ${REPOPILOT_MAX_STEPS:-12}
      REPOPILOT_MAX_TOOL_CALLS: ${REPOPILOT_MAX_TOOL_CALLS:-40}
      REPOPILOT_MAX_TOOL_CALLS_PER_STEP: ${REPOPILOT_MAX_TOOL_CALLS_PER_STEP:-4}
      REPOPILOT_MAX_TOTAL_TOKENS: ${REPOPILOT_MAX_TOTAL_TOKENS:-100000}
      REPOPILOT_MAX_REVIEW_ROUNDS: ${REPOPILOT_MAX_REVIEW_ROUNDS:-2}
      REPOPILOT_TOOL_TIMEOUT_SECONDS: ${REPOPILOT_TOOL_TIMEOUT_SECONDS:-20}
      REPOPILOT_TOOL_MAX_ATTEMPTS: ${REPOPILOT_TOOL_MAX_ATTEMPTS:-2}
      REPOPILOT_TOOL_RETRY_BASE_SECONDS: ${REPOPILOT_TOOL_RETRY_BASE_SECONDS:-0.1}
      REPOPILOT_SSE_POLL_SECONDS: ${REPOPILOT_SSE_POLL_SECONDS:-0.2}
      REPOPILOT_SSE_HEARTBEAT_SECONDS: ${REPOPILOT_SSE_HEARTBEAT_SECONDS:-15}
      REPOPILOT_LOG_LEVEL: ${REPOPILOT_LOG_LEVEL:-INFO}
    volumes:
      - repopilot-data:/app/data
      - repopilot-repositories:/repositories
      - ${REPOPILOT_WORKSPACE:-.}:/workspace:ro
      - ${REPOPILOT_IMPORT_ROOT:-.}:/imports:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 256
volumes:
  repopilot-data:
  repopilot-repositories:
